services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      # Accessible uniquement depuis la machine hôte (dev local), jamais depuis Internet
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: lsfdb
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d lsfdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./lsf-api
      network: host
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=lsfdb;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      # Obligatoire (32 caractères min) : l'API refuse de démarrer sans
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET manquant}
      Jwt__Issuer: lsf-api
      Jwt__Audience: lsf-web
      Jwt__ExpiresInDays: 7
      EmailSettings__SendGridApiKey: ${SENDGRID_API_KEY}
      EmailSettings__FromEmail: ${EMAIL_FROM}
      EmailSettings__FromName: "Learn-it LSF"
      EmailSettings__BaseUrl: https://${DOMAIN}
      AllowedOrigins__0: https://${DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./lsf-web
      network: host
    restart: unless-stopped
    depends_on:
      - api

  # Seul service exposé : HTTPS automatique (Let's Encrypt), /api -> API, le reste -> front.
  # Front et API sur le même domaine : le cookie de session est visible par les deux.
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN manquant}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
